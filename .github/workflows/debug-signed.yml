name: Debug APK (release-signed)

# 用仓库 secrets 里的正式 keystore 给 debug 变体签名，产出「可调试 + 能覆盖手机上正式版」的安装包。
# 本地没有正式私钥时，这是让 debug 包覆盖正式包的唯一途径；数据不会丢（包名、签名、Room schema 都不变）。

on:
  workflow_dispatch:
    inputs:
      note:
        description: '可选备注，会追加到 artifact 文件名'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: wallet-sentinel-debug-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Android SDK
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /usr/local/lib/android/sdk/cmdline-tools
          curl -sSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          mv cmdline-tools latest
          yes | latest/bin/sdkmanager --licenses > /dev/null || true
          latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > deepseek-balance.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=deepseek-balance.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=deepseek
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Show build identity
        run: |
          echo "HEAD=$(git describe --tags --always --dirty)"
          echo "COMMITS=$(git rev-list --count HEAD)"

      - name: Build release-signed debug APK
        run: |
          ./gradlew assembleDebug \
            -PwalletSentinel.signingConfigFile=keystore.properties \
            --no-daemon --stacktrace

      - name: Verify APK metadata and signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=/usr/local/lib/android/sdk/build-tools/34.0.0
          $BUILD_TOOLS/aapt dump badging "$APK" | head -n 1
          DIGEST=$($BUILD_TOOLS/apksigner verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          PINNED=319aa8dae339e8c95e5538331605550d7abc94992cbeb5ce54b74b276ccbad3f
          if [ "$DIGEST" != "$PINNED" ]; then
            echo "::error::Signer mismatch: got $DIGEST"
            exit 1
          fi
          echo "Signer matches the release certificate."
          $BUILD_TOOLS/zipalign -c -v 4 "$APK" > /dev/null

      - name: Rename artifact
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/debug
          SUFFIX=""
          if [ -n "${NOTE:-}" ]; then SUFFIX="-${NOTE}"; fi
          mv app-debug.apk "wallet-sentinel-debug-signed-${GITHUB_RUN_NUMBER}${SUFFIX}.apk"
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-sentinel-debug-signed
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
