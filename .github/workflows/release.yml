name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.5.1)'
        required: true
        default: 'v1.5.1'

permissions:
  contents: write

concurrency:
  group: wallet-sentinel-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Attach APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest 2>/dev/null || true
          rm commandlinetools-linux-11076708_latest.zip

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > deepseek-balance.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=deepseek-balance.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=deepseek
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Determine and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$PUSH_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          CHECKED_OUT_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ "$CHECKED_OUT_TAG" != "$TAG" ]; then
            echo "Checkout is not the requested release tag: $CHECKED_OUT_TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          grep -Eq "^## \[$VERSION\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $TAG" >&2
            exit 1
          }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $TAG"

      - name: Run JVM tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --no-daemon --stacktrace

      - name: Extract test failures
        if: always()
        run: |
          mkdir -p app/build/test-failures
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml app/build/test-results/testReleaseUnitTest/TEST-*.xml; do
            if grep -q 'failures="[1-9]"\|errors="[1-9]"' "$f" 2>/dev/null; then
              cp "$f" app/build/test-failures/
            fi
          done
          if [ -f app/build/reports/tests/testDebugUnitTest/index.html ]; then
            cp app/build/reports/tests/testDebugUnitTest/index.html app/build/test-failures/
          fi
          echo "Failures extracted: $(ls app/build/test-failures/ 2>/dev/null | wc -l) files"

      - name: Upload test failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-release
          path: app/build/test-failures/
          retention-days: 7

      - name: Run lint
        run: ./gradlew lintDebug lintRelease koverVerify --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease -PwalletSentinel.signingConfigFile=keystore.properties --no-daemon

      - name: Verify APK metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.balancesentinel.app'" >/dev/null
          echo "$BADGING" | grep -F "versionName='$RELEASE_VERSION'" >/dev/null

      - name: Verify release signer allowlist
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$($APKSIGNER verify --print-certs "$APK" 2>&1 \
            | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' \
            | head -1 | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_HEX=$(printf '%s' "$EXPECTED_RELEASE_CERT_SHA256" \
            | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED="${EXPECTED_HEX: -64}"
          PINNED="319AA8DAE339E8C95E5538331605550D7ABC94992CBEB5CE54B74B276CCBAD3F"
          echo "Release signer digest lengths: actual=${#ACTUAL}, expected=${#EXPECTED}"
          if test "${#ACTUAL}" -ne 64; then
            echo "::error file=.github/workflows/release.yml,line=1,title=Release signer parse failure::actual_length=${#ACTUAL}"
            exit 1
          elif test "$ACTUAL" = "$PINNED"; then
            echo "Release signer matched the pinned certificate."
          elif test "${#EXPECTED_HEX}" -ge 64 && test "${#EXPECTED}" -eq 64 \
            && test "$ACTUAL" = "$EXPECTED"; then
            echo "Release signer matched the configured certificate."
          else
            ACTUAL_B64=$(printf '%s' "$ACTUAL" | base64 -w0)
            echo "::error file=.github/workflows/release.yml,line=1,title=Release signer mismatch::actual_b64=$ACTUAL_B64 expected_length=${#EXPECTED}"
            exit 1
          fi

      - name: Rename APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk balance-sentinel-${{ steps.version.outputs.tag }}.apk

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n.*?(?=^## \[|\Z)",
              changelog,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no entry for v{version}")
          Path("release-notes.md").write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY
          test -s release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="balance-sentinel-$TAG.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
          gh release upload "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq ".assets[] | select(.name == \"$APK\") | .size" \
            | grep -Eq '^[1-9][0-9]*$'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: balance-sentinel-${{ steps.version.outputs.tag }}
          path: balance-sentinel-${{ steps.version.outputs.tag }}.apk
          retention-days: 90
