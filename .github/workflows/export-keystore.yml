name: Export signing keystore (one-off backup)

# ⚠️ 仅限私有仓库、仅限仓库所有者手动运行。
# 第 1 步会查仓库可见性，公开仓库直接失败。
# 产出：用你自己输入的密码做 AES-256 加密的 zip（内含 deepseek-balance.jks + keystore.properties）。
# 下载后请立刻：删除本次 run、删除 artifact，把 zip 存到离线介质。

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: '给导出包加密的密码（至少 12 位，务必记牢）'
        required: true
      confirm:
        description: '请输入 EXPORT 以确认导出私钥'
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - refuse on public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }})
          VIS=$(printf '%s' "$META" | grep -o '"visibility": *"[a-z]*"' | head -n1 | cut -d'"' -f4)
          echo "repository visibility = $VIS"
          if [ "$VIS" != "private" ]; then
            echo "::error::Refusing to export a private key from a non-private repository ($VIS)."
            exit 1
          fi

      - name: Guard - require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "EXPORT" ]; then
            echo "::error::Confirmation phrase mismatch; nothing exported."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > deepseek-balance.jks
          test -s deepseek-balance.jks
          test "$(stat -c%s deepseek-balance.jks)" -gt 1000

      - name: Write keystore.properties
        run: |
          set -euo pipefail
          umask 077
          cat > keystore.properties << 'EOF'
          storeFile=deepseek-balance.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=deepseek
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verify certificate fingerprint
        run: |
          set -euo pipefail
          STORE_PASS=$(grep '^storePassword=' keystore.properties | cut -d= -f2-)
          GOT=$(keytool -list -v -keystore deepseek-balance.jks -storepass "$STORE_PASS" -alias deepseek \
            | grep -i 'SHA256:' | head -n 1 | sed 's/.*SHA256: *//I' | tr -d ': ' | tr 'A-F' 'a-f')
          PINNED=319aa8dae339e8c95e5538331605550d7abc94992cbeb5ce54b74b276ccbad3f
          if [ "$GOT" != "$PINNED" ]; then
            echo "::error::Certificate fingerprint mismatch: $GOT"
            exit 1
          fi
          echo "Certificate fingerprint matches the shipped release APK."

      - name: Encrypt bundle
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${#PASSPHRASE}" -lt 12 ]; then echo '::error::passphrase must be at least 12 chars'; exit 1; fi
          zip -q bundle.zip deepseek-balance.jks keystore.properties
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in bundle.zip -out keystore-backup.zip.enc -pass env:PASSPHRASE
          rm -f bundle.zip deepseek-balance.jks keystore.properties
          ls -la keystore-backup.zip.enc

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: keystore-backup.zip.enc
          retention-days: 1
          if-no-files-found: error

      - name: Reminder
        run: |
          echo '::notice::下载 keystore-backup.zip.enc 后，立刻删除本次 run 与 artifact。'
          echo '解密: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore-backup.zip.enc -out bundle.zip'
